    <!-- Footer - NÃO ALTERADO -->
    <footer class="site-footer">
        <!-- BARRA SUPERIOR DO FOOTER (separadora) -->
        <div class="footer-top-bar">
            <div class="footer-top-bar-content">
                <!-- Ícone/logotipo dentro da barra superior -->
                <img src="images/footer-icon.png" alt="Footer Icon" class="footer-icon">
            </div>
        </div>
        
        <!-- CORPO PRINCIPAL DO FOOTER (3 colunas) - AGORA COM PLACEHOLDERS -->
        <div class="footer-main">
            <div class="footer-grid">
                <!-- Coluna esquerda: 3 placeholders empilhados -->
                <div class="footer-column left-column">
                    <div class="footer-card small-card"></div>
                    <div class="footer-card small-card"></div>
                    <div class="footer-card small-card"></div>
                </div>
                
                <!-- Coluna central: 1 placeholder grande -->
                <div class="footer-column center-column">
                    <div class="footer-card large-card"></div>
                </div>
                
                <!-- Coluna direita: 1 placeholder vertical alto -->
                <div class="footer-column right-column">
                    <div class="footer-card tall-card"></div>
                </div>
            </div>
        </div>
        
        <!-- BARRA INFERIOR DO FOOTER (final da página) -->
        <div class="footer-bottom-bar">
            <div class="footer-bottom-bar-content">
                <!-- Logo horizontal centralizada -->
                <img src="images/footer-bottom-logo.png" alt="Bottom Logo" class="footer-bottom-logo">
            </div>
        </div>
    </footer>
